<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>책방틈</title>
  <link rel="icon" href="asset/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* 저장된 화면 설정(글자 크기·다크 모드)을 깜빡임 없이 먼저 적용 */
    try {
      var s = JSON.parse(localStorage.getItem('bookstore.settings') || '{}');
      if (s.fs) document.documentElement.setAttribute('data-fs', s.fs);
      if (s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <header class="apphead">
      <button type="button" class="header-back" id="headerBack" data-action="back" aria-label="이전 화면으로 돌아가기" title="뒤로 가기" hidden><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button type="button" class="header-brand brand-home" data-action="goHome" aria-label="홈으로 이동"><img class="brand-logo" src="asset/bookbangteum-logo.png" alt=""><strong id="pageTitle">책방틈</strong></button>
      <div class="head-actions"><button type="button" class="header-login-icon" id="headerLogin" data-action="headerAccount" aria-label="로그인" title="로그인"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg></button><div class="account-menu" id="accountMenu" role="menu" aria-label="계정 메뉴" hidden></div><button type="button" class="icon-btn hamburger-btn" data-action="openMenu" aria-label="메뉴" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
    </header>

    <main class="screens" id="screens">

      <!-- 01 홈: 브랜드 소개 → 탐색 → 추천 → 새소식 → 개인화 -->
      <section class="screen home-screen" data-screen="home" hidden>
        <div class="home-hero">
          <div class="home-hero-content">
            <h2>오늘은 어떤 책방에<br>가보고 싶나요?</h2>
            <form class="search home-search" id="homeSearch" role="search">
              <input type="search" id="homeQuery" placeholder="지역이나 책방 이름을 검색해 보세요" aria-label="지역이나 책방 이름 검색" autocomplete="off">
              <button type="submit" class="search-btn">검색</button>
            </form>
            <div class="home-topics" aria-label="추천 탐색 주제">
              <button type="button" class="home-topic" data-action="quickTopic" data-key="category" data-value="독립출판">#독립출판</button>
              <button type="button" class="home-topic" data-action="quickTopic" data-key="mood" data-value="조용함">#조용한 공간</button>
              <button type="button" class="home-topic" data-action="quickTopic" data-key="reviewFacility" data-value="혼자 가기">#혼자 가기</button>
              <button type="button" class="home-topic" data-action="quickTopic" data-key="reviewFacility" data-value="좌석">#좌석 있는 곳</button>
            </div>
          </div>
        </div>
        <div id="homeDiscovery"></div>
        <div id="homeExtra"></div>
      </section>

      <!-- 02 책방 목록 / 10 결과 없음 -->
      <section class="screen" data-screen="list" hidden>
        <div class="search">
          <input type="search" id="listQuery" placeholder="마포구, 책방 이름 검색" aria-label="책방 검색" autocomplete="off">
        </div>
        <div class="chips" id="filterChips"></div>
        <div class="selected" id="selectedBox"></div>
        <div class="rowline">
          <b id="resultMeta">검색 결과</b>
          <label class="sort">정렬:
            <select id="sortSelect" aria-label="정렬">
              <option value="name">이름순</option>
              <option value="reviews">후기 많은순</option>
            </select>
          </label>
        </div>
        <div id="listBody"></div>
        <button type="button" class="more" id="moreBtn" data-action="loadMore" hidden>목록 더 보기 ↓</button>
      </section>

      <!-- 03 책방 상세 (책방 정보 · 줄글 후기 탭) -->
      <section class="screen" data-screen="detail" hidden>
        <div id="detailBody"></div>
      </section>

      <!-- 04 방문자 후기·키워드 -->
      <section class="screen" data-screen="reviews" hidden>
        <div id="reviewBody"></div>
      </section>

      <!-- 05 나의 책방 -->
      <section class="screen" data-screen="my" hidden>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-action="myTab" data-tab="fav">즐겨찾기</button>
          <button type="button" role="tab" data-action="myTab" data-tab="reviews">내 후기</button>
          <button type="button" role="tab" data-action="myTab" data-tab="courses">저장 코스</button>
        </div>
        <div id="myBody"></div>
      </section>

      <!-- 로그인 / 회원가입 1단계 (아이디·비밀번호) -->
      <section class="screen" data-screen="auth" hidden>
        <div class="auth-panel">
          <h2>로그인 / 회원가입</h2>
          <form id="authForm">
            <label for="authId">아이디</label>
            <input id="authId" name="userId" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required placeholder="영문·숫자 4~20자">
            <label for="authPw">비밀번호</label>
            <input id="authPw" name="password" type="password" autocomplete="current-password" maxlength="32" required placeholder="영문·숫자 포함 8자 이상">
            <p class="para">회원가입을 누르면 다음 화면에서 닉네임·위치·취향을 설정해요. 비밀번호를 잊으면 계정을 복구하기 어려워요.</p>
            <button class="btn" type="submit" name="authMode" value="login">로그인</button>
            <button class="btn light" type="submit" name="authMode" value="signup">회원가입</button>
          </form>
        </div>
      </section>

      <!-- 회원가입 2단계: 닉네임·위치·취향 -->
      <section class="screen" data-screen="signup" hidden>
        <div id="signupBody"></div>
      </section>

      <!-- 내 정보 설정: 닉네임·위치·취향 수정, 로그아웃, 회원 탈퇴 -->
      <section class="screen" data-screen="profile" hidden>
        <div id="profileBody"></div>
      </section>

      <!-- 코스 허브: 전체 코스 · 저장한 코스 -->
      <section class="screen" data-screen="course" hidden>
        <div id="courseBody"></div>
      </section>

      <!-- 06 코스 조건 설정 -->
      <section class="screen" data-screen="course-setup" hidden>
        <div id="setupBody"></div>
      </section>

      <!-- 07 지도·코스 결과 -->
      <section class="screen" data-screen="map" hidden>
        <div id="mapBody"></div>
      </section>

      <!-- 08 코스 편집·저장 -->
      <section class="screen" data-screen="edit" hidden>
        <div id="editBody"></div>
      </section>

      <!-- 09 나의 취향 -->
      <section class="screen" data-screen="taste" hidden>
        <div id="tasteBody"></div>
      </section>

      <!-- 12 코스 저장 완료 -->
      <section class="screen" data-screen="done-course" hidden>
        <div id="doneCourseBody"></div>
      </section>
    </main>

    <button type="button" id="scrollTopButton" class="scroll-top-button" aria-label="맨 위로 이동" title="맨 위로 이동" hidden>TOP</button>

    <nav class="bottom" aria-label="주요 메뉴">
      <button type="button" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>홈</span></button>
      <button type="button" data-nav="list"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>책방 탐색</span></button>
      <button type="button" data-nav="course"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg><span>코스</span></button>
      <button type="button" data-nav="my"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>나의 책방</span></button>
    </nav>

    <div class="sheet-wrap" id="sheetWrap" hidden>
      <div class="backdrop" data-action="closeSheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
        <div class="sheet-head">
          <strong id="sheetTitle"></strong>
          <button type="button" class="icon-btn" data-action="closeSheet" aria-label="닫기">✕</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
